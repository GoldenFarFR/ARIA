title = "ARIA gitleaks config"

# Extends the default gitleaks ruleset (hundreds of known secret patterns +
# generic high-entropy detectors) -- we only add allowlist entries on top,
# never replace the base rules.
[extend]
useDefault = true

[allowlist]
description = "Known false positives, verified by hand (23/07 audit) -- never real secrets."
paths = [
  # detect-secrets baseline: contains SHA1 *hashes* of already-reviewed
  # findings, never raw values (field name is literally `hashed_secret`,
  # 40 hex chars = SHA1 digest) -- regenerated regularly by the
  # detect-secrets tool, would otherwise re-trigger hundreds of false
  # positives on every update to this file.
  '''\.secrets\.baseline''',
  # Deliberate corpus of attack payloads (forged JWTs, SQLi strings, auth
  # bypass attempts) used to test our own security-sim detectors -- these
  # are fabricated examples, not real credentials.
  '''vanguard/backend/security_sim/corpus\.py''',
  # Flaunch client tests (24/07): real Base contract/pool/tx addresses used
  # as fixtures for parsing tests -- on-chain data, public by nature (never
  # a secret, unlike an API key). Flagged only by the generic high-entropy
  # detector on hex strings, same false-positive class already present
  # (unallowlisted) in test_clanker_client.py/test_dexscreener_client.py/
  # test_agent_wallet_monitor.py -- scoped here rather than widened to all
  # of tests/, to keep this allowlist narrow and each entry individually
  # justified.
  '''packages/aria-core/tests/test_flaunch_client\.py''',
  # Same false-positive class (24/07, bonding-entry chantier): a real
  # deployer wallet address, copied from a live-verified Virtuals API
  # payload into a fixture (test_parse_virtual_bonding_entry_native_fields)
  # -- an on-chain address, public by nature, never a secret.
  '''packages/aria-core/tests/test_virtuals_client\.py''',
  # Same false-positive class (19/08, Solana signer promotion): real devnet
  # multisig/spending-limit CREATE-KEY base58 pubkeys, pinned as fixed
  # expected values for PDA-derivation regression tests
  # (test_derive_*_pda_matches_real_devnet_account) -- these are PUBLIC
  # addresses used only as seeds to DERIVE a Program Derived Address
  # (Squads v4's own `multisigCreateV2`/`multisigAddSpendingLimit`
  # convention), never private key material -- no private key for either
  # ever appears in this repo. The generic-api-key detector flags them on
  # entropy alone, same class already allowlisted above for
  # test_flaunch_client.py/test_virtuals_client.py.
  '''packages/aria-core/tests/test_squads_solana_signer\.py''',
  # Same false-positive class (19/08, PumpPortal fast-discovery chantier): a
  # real pump.fun bonding-curve account address used as a fixture to test
  # parsing of a real `subscribeNewToken` websocket message -- a
  # `bondingCurveKey` is an on-chain PUBLIC account address (equivalent to a
  # pool address), never a private key, never a secret. Flagged by the
  # generic-api-key detector on entropy alone, same class as every other
  # entry above.
  '''packages/aria-core/tests/test_pumpportal_ws\.py''',
]
regexes = [
  # The Python constant name `_MAX_TOP10_HOLDER_PCT` alone trips the generic
  # high-entropy detector (24/07, bonding_entry.py) -- a source-code
  # identifier, never a secret value. Matched narrowly by name (not a path
  # allowlist) so the rest of the file stays fully scanned.
  '''_MAX_TOP10_HOLDER_PCT''',
  # 08/03, test_polymarket_execution.py: a deliberately fake, self-labeled
  # test value (`secret_key = "0xTHIS_MUST_NEVER_APPEAR_IN_LOGS_..."`) used
  # to assert a real private key never appears in a log line -- the
  # variable name plus hex-like suffix trips the generic-api-key detector.
  # Matched by the distinctive fake value itself, never a real secret.
  '''THIS_MUST_NEVER_APPEAR_IN_LOGS''',
]
