# Dashboard opérateur privé (product-frontend/OperatorDashboard) --
# ops.ariavanguardzhc.com. Sert le build Vite de vanguard/product-frontend/
# (dist/), avec l'API proxifiée en local (même upstream que api.ariavanguardzhc.com,
# aria-api-upstream.conf) -- product-frontend appelle des chemins RELATIFS
# ('/api/...', voir src/api.ts), jamais cross-origin.
#
# Accès aux données protégé par le login TOTP opérateur (operator_mobile.py),
# PAS par ce fichier -- une exposition publique de ce sous-domaine n'expose
# rien tant que le mot de passe + code TOTP restent secrets.
#
# ── Installation (UNE seule fois) ────────────────────────────────────────────
#   1) cp vanguard/nginx/ops.conf /etc/nginx/sites-available/ops
#   2) ln -sf /etc/nginx/sites-available/ops /etc/nginx/sites-enabled/ops
#   3) ./vanguard/deploy-ops.sh          # build + publie dans le webroot + reload
#   4) certbot --nginx -d ops.ariavanguardzhc.com
#      -> certbot ajoute tout seul le bloc `listen 443 ssl` + la redirection
#         http->https et gère le renouvellement. Après ça, ce fichier vit sous
#         gestion certbot ; les déploiements suivants ne relancent QUE
#         deploy-ops.sh (aucun edit nginx).
#
# PRÉREQUIS DNS : un enregistrement A `ops` pointant sur l'IP du VPS doit
# exister AVANT l'étape 4 (certbot échoue sinon) -- à ajouter chez le
# registrar/DNS, hors de portée de ce fichier.

server {
    listen 80;
    listen [::]:80;
    server_name ops.ariavanguardzhc.com;

    root /var/www/aria-ops;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Never indexed -- an operator-only panel has no reason to appear in search.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://aria_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA -- /ops, a reload, a bookmark all serve index.html (200),
    # React Router (path-based here) takes over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
